plugins { id 'com.android.application' }

android {
    namespace 'io.github.forkdex'
    compileSdk 35

    defaultConfig {
        applicationId 'io.github.forkdex'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '0.2.1'
    }

    signingConfigs {
        release {
            storeFile file(System.getenv('FORKDEX_KEYSTORE_PATH') ?: "${rootDir}/missing-release-key.jks")
            storePassword System.getenv('FORKDEX_KEYSTORE_PASSWORD')
            keyAlias System.getenv('FORKDEX_KEY_ALIAS')
            keyPassword System.getenv('FORKDEX_KEY_PASSWORD')
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }

    // The freeform service intentionally uses a hidden system API through
    // Shizuku. Keep the implementation intact and suppress only this lint
    // diagnostic; runtime behavior is unchanged.
    lint {
        disable += ['BlockedPrivateApi']
    }

    buildFeatures {
        aidl true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation('dev.rikka.shizuku:api:13.1.5')
    implementation('dev.rikka.shizuku:provider:13.1.5')
}
